<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrosterHIT — консоль</title>
<style>
:root{
  /* Groster: маджента #BC39E5 + золото #FECC00 — bold / glassmorphism */
  --canvas:#ffffff; --bg:#f4f4f7;
  --surface:rgba(255,255,255,.78); --surface-solid:#ffffff; --surface-2:rgba(22,18,34,.05);
  --border:rgba(22,18,34,.10); --glass-border:rgba(255,255,255,.8); --blur:16px;
  --text:#191223; --muted:#6d6479; --accent:#a81fcb; --accent-weak:rgba(188,57,229,.11);
  --brand:#bc39e5; --gold:#fecc00; --orange:#fc6631;
  --grad:linear-gradient(135deg,#c33be1 0%,#8b3ff0 55%,#6a5cf5 100%);
  --grad-soft:linear-gradient(135deg,rgba(195,59,225,.16),rgba(106,92,245,.12));
  --ok:#12986a; --warn:#c24710; --alert:#e0464b;
  --sidebar:rgba(250,250,252,.72); --side-text:#453c52; --side-muted:#8f85a0;
  --side-active:rgba(188,57,229,.12); --side-hover:rgba(22,18,34,.045); --side-border:rgba(22,18,34,.08);
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --r:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(28,21,36,.04),0 10px 30px rgba(120,50,160,.09);
  --shadow-lg:0 2px 6px rgba(28,21,36,.05),0 20px 48px rgba(120,50,160,.16);
  --glow:0 6px 22px rgba(168,31,203,.34);
}
.dark{
  --bg:#0b0812;
  --canvas:radial-gradient(1200px 720px at 84% -12%,rgba(188,57,229,.22),transparent 55%),radial-gradient(1000px 640px at -8% 12%,rgba(106,92,245,.16),transparent 52%),radial-gradient(900px 760px at 55% 118%,rgba(254,204,0,.06),transparent 55%),#0b0812;
  --surface:rgba(28,20,40,.6); --surface-solid:#18121f; --surface-2:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.09); --glass-border:rgba(255,255,255,.12); --blur:18px;
  --text:#f0e8f7; --muted:#a89eb8; --accent:#cf6bef; --accent-weak:rgba(207,107,239,.16);
  --brand:#c15ae8; --gold:#fecc00; --orange:#ff7a4d;
  --grad:linear-gradient(135deg,#d24bf0 0%,#9a55f5 55%,#7b6cf8 100%);
  --grad-soft:linear-gradient(135deg,rgba(210,75,240,.22),rgba(123,108,248,.16));
  --ok:#2eb681; --warn:#fc6631; --alert:#f0575c;
  --sidebar:rgba(19,13,27,.55); --side-text:#d6cbe4; --side-muted:#8a7e9a;
  --side-active:rgba(207,107,239,.16); --side-hover:rgba(255,255,255,.05); --side-border:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.5);
  --shadow-lg:0 2px 8px rgba(0,0,0,.45),0 28px 60px rgba(0,0,0,.6);
  --glow:0 6px 26px rgba(207,107,239,.4);
}
@media (prefers-color-scheme:dark){:root:not(.light){
  --bg:#0b0812;
  --canvas:radial-gradient(1200px 720px at 84% -12%,rgba(188,57,229,.22),transparent 55%),radial-gradient(1000px 640px at -8% 12%,rgba(106,92,245,.16),transparent 52%),radial-gradient(900px 760px at 55% 118%,rgba(254,204,0,.06),transparent 55%),#0b0812;
  --surface:rgba(28,20,40,.6); --surface-solid:#18121f; --surface-2:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.09); --glass-border:rgba(255,255,255,.12); --blur:18px;
  --text:#f0e8f7; --muted:#a89eb8; --accent:#cf6bef; --accent-weak:rgba(207,107,239,.16);
  --brand:#c15ae8; --gold:#fecc00; --orange:#ff7a4d;
  --grad:linear-gradient(135deg,#d24bf0 0%,#9a55f5 55%,#7b6cf8 100%);
  --grad-soft:linear-gradient(135deg,rgba(210,75,240,.22),rgba(123,108,248,.16));
  --ok:#2eb681; --warn:#fc6631; --alert:#f0575c;
  --sidebar:rgba(19,13,27,.55); --side-text:#d6cbe4; --side-muted:#8a7e9a;
  --side-active:rgba(207,107,239,.16); --side-hover:rgba(255,255,255,.05); --side-border:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.5);
  --shadow-lg:0 2px 8px rgba(0,0,0,.45),0 28px 60px rgba(0,0,0,.6);
  --glow:0 6px 26px rgba(207,107,239,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);background-attachment:fixed;
  color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;display:grid;grid-template-columns:248px 1fr}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Sidebar */
aside{background:var(--sidebar);color:var(--side-text);display:flex;flex-direction:column;
  height:100vh;position:sticky;top:0;padding:20px 0;border-right:1px solid var(--side-border);
  backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4)}
.logo{display:flex;align-items:center;gap:11px;padding:0 20px 20px;border-bottom:1px solid var(--side-border);margin-bottom:4px}
.mark{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--grad);box-shadow:var(--glow)}
.mark svg{width:20px;height:20px;color:#fff}
.logo b{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.logo span{display:block;font-size:11px;color:var(--side-muted)}
nav{flex:1;overflow-y:auto;padding:6px 12px}
.navgroup{color:var(--side-muted);font-size:10.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;padding:16px 10px 6px}
.navlink{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--side-text);
  text-decoration:none;font-weight:520;font-size:13.5px;cursor:pointer;transition:background .12s;position:relative}
.navlink:hover{background:var(--side-hover)}
.navlink.active{background:var(--side-active);color:var(--accent);font-weight:650}
.navlink.active svg{opacity:1;color:var(--accent)}
.navlink.active::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;
  border-radius:0 4px 4px 0;background:var(--grad)}
.navlink svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.navlink .badge{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--side-muted)}
.navlink .sdot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.navlink .sdot.off{background:var(--side-muted)}
.sidefoot{padding:12px 20px 0;border-top:1px solid var(--side-border);margin-top:8px;
  color:var(--side-muted);font-size:11px}

/* Topbar + main */
main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--border);
  background:var(--surface);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);z-index:5}
.burger{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 auto;
  border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;cursor:pointer;padding:0}
.burger:hover{background:var(--surface-2)} .burger svg{width:18px;height:18px}
.burger:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.crumb{margin-right:auto}
.crumb h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
.crumb small{color:var(--muted);font-size:12px}
.updated{color:var(--muted);font-size:12px;white-space:nowrap}
.themebtn{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--bg);
  color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:550;cursor:pointer}
.themebtn:hover{background:var(--surface-2)}
.themebtn svg{width:15px;height:15px}
.view{padding:28px;overflow-y:auto;flex:1}
.loadbar{height:2px;background:transparent;overflow:hidden;flex:0 0 auto}
.loadbar.on{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.loadbar.on::after{content:"";display:block;height:100%;width:40%;background:var(--accent);
  animation:loadslide 1s ease-in-out infinite}
@keyframes loadslide{0%{margin-left:-40%}100%{margin-left:100%}}

/* Shared components */
.grid{display:grid;gap:14px}
.eyebrow{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
.eyebrow h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.eyebrow .rule{flex:1;height:1px;background:var(--border)}
section+section{margin-top:32px}
.card{background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;
  backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3)}
.svc-name{font-weight:650;font-size:15px;letter-spacing:-.01em}
.svc-sub{color:var(--muted);font-size:12px;margin-top:1px}
.btn{font:inherit;font-weight:600;font-size:13px;cursor:pointer;border-radius:10px;padding:9px 16px;
  border:1px solid var(--glass-border);background:var(--surface);color:var(--text);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .15s,transform .08s,box-shadow .15s}
.btn:hover{background:var(--surface-2);box-shadow:var(--shadow)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.07);box-shadow:var(--glow),var(--shadow-lg);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:7px;padding:3px 8px}
.chip b{color:var(--text);font-weight:600}

.switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{position:relative;width:38px;height:22px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);transition:background .18s;flex:0 0 auto}
.track::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
.switch input:checked+.track{background:var(--ok);border-color:var(--ok)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.switch input:checked~.lbl{color:var(--ok)}

.meter{margin-top:13px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px}
.meter-row .name{color:var(--muted);font-weight:550}
.meter-row .val{font-family:var(--mono);font-weight:600}
.meter-row .val .b{color:var(--muted);font-weight:500}
.rail{height:7px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.fill{height:100%;border-radius:6px;min-width:2px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.fill.green{background:var(--ok)} .fill.yellow{background:var(--orange)} .fill.red{background:var(--alert)}
.tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.32;left:100%}

.tiles{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.recgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.recitem{border:1px solid var(--border);border-radius:11px;padding:10px;background:var(--bg);position:relative}
.recitem.dim{opacity:.5}
.recpos{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:7px;background:var(--grad);
  color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:var(--glow)}
.recimg{width:100%;height:96px;object-fit:contain;border-radius:8px;background:var(--surface-2)}
.recimg.ph{display:grid;place-items:center;color:var(--muted);font-size:11px}
.recname{font-size:12.5px;font-weight:550;margin:8px 0 3px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.recprice{font-family:var(--mono);font-weight:600;font-size:13px}
.recflag{font-size:11px;margin-top:4px}
.listrow{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--border);font-size:13px}
.listrow:last-child{border-bottom:none}
.listrow.dim{opacity:.5}
.lr-name{flex:1;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-art{color:var(--muted);font-size:12px;width:80px}
.lr-price{font-weight:600;width:100px;text-align:right}
.srcbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 18px;margin-bottom:12px}
.statbar{display:flex;gap:32px;flex-wrap:wrap;padding:16px 18px;margin-bottom:20px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-weight:600;font-size:13px;padding:7px 15px;border:none;border-left:1px solid var(--border);
  background:none;color:var(--muted);cursor:pointer}
.seg button:first-child{border-left:none}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--grad);color:#fff}
.tile{background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;
  backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);
  position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s}
.tile::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.9}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.tile .l{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .n{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;margin:8px 0 2px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;width:fit-content}
.tile .s{color:var(--muted);font-size:11.5px;font-family:var(--mono)} .tile .s.stale{color:var(--warn)}

.tablewrap{background:var(--surface-solid);border:1px solid var(--glass-border);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:11px 15px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;position:sticky;top:0;background:var(--surface-solid)}
tbody tr:last-child td{border-bottom:none} tbody tr:hover{background:var(--surface-2)}
td.mono{font-family:var(--mono)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.clicked,.pill.opened{background:var(--accent-weak);color:var(--accent)}
.pill.sent,.pill.delivered,.pill.live{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.bounced,.pill.unsubscribed,.pill.dev{background:color-mix(in srgb,var(--alert) 14%,transparent);color:var(--alert)}
.pill.queued{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--warn)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:10px;height:210px;padding:6px 2px;border-bottom:1px solid var(--border)}
.chart.dense{gap:3px}
.chart.dense .bar-val{display:none}
.chart.dense .bar{border-radius:3px 3px 0 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar-val{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:5px;white-space:nowrap}
.bar{width:100%;max-width:46px;background:var(--grad);border-radius:6px 6px 0 0;min-height:3px;transition:height .4s cubic-bezier(.2,.7,.3,1)}
.bar.weekend{background:color-mix(in srgb,var(--accent) 55%,var(--muted))}
.bar-lbl{font-size:12px;color:var(--muted);margin-top:7px}
.bar-lbl.weekend{color:var(--text);font-weight:600}
.legend{color:var(--muted);font-size:12px;margin:12px 2px 0}
.legend b.green{color:var(--ok)}.legend b.yellow{color:var(--warn)}.legend b.red{color:var(--alert)}
.inp{font:inherit;font-family:var(--mono);width:78px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.inp.wide{width:260px;font-family:var(--sans)}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:520px){.inp.wide{width:150px}}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.field:last-child{border-bottom:none} .field .k{color:var(--muted);font-size:13px}
.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{font:inherit;font-weight:600;font-size:13.5px;color:var(--muted);background:none;border:none;
  padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pager{display:flex;align-items:center;gap:14px;justify-content:flex-end;margin-top:12px}
.pager .svc-sub{margin:0}
select.inp{width:auto;font-family:var(--sans)}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.check:last-child{border-bottom:none}
.check .mk{width:18px;height:18px;flex:0 0 auto;border-radius:5px;background:var(--surface-2);color:var(--muted);
  display:grid;place-items:center;font-size:12px;margin-top:1px}
.check .mk.on{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.check .t{font-size:13px} .check .t small{display:block;color:var(--muted);font-size:12px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:11px;font-weight:600;font-size:13px;
  box-shadow:var(--shadow);transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Свёрнутый сайдбар: только иконки */
body.nav-collapsed{grid-template-columns:64px 1fr}
.nav-collapsed aside{padding:20px 0}
.nav-collapsed .logo{justify-content:center;padding:0 0 16px}
.nav-collapsed .logo>div{display:none}
.nav-collapsed nav{padding:6px 8px}
.nav-collapsed .navgroup{display:none}
.nav-collapsed .navlink{justify-content:center;padding:10px 0;gap:0}
.nav-collapsed .navlink>span{display:none}
.nav-collapsed .navlink .sdot{display:block;position:absolute;top:6px;right:8px;margin:0}
.nav-collapsed .navlink.active::before{left:-8px}
.nav-collapsed .sidefoot{display:none}
@media (max-width:820px){body{grid-template-columns:1fr} aside{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Конструктор шаблонов */
.pal-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.tpl-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:16px}
.tpl-pal button{display:flex;flex-direction:column;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:13px 6px 10px;font-size:11.5px;font-weight:500;cursor:pointer;color:var(--muted);transition:.13s ease}
.tpl-pal button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.tpl-pal button svg{color:var(--text);transition:.13s}
.tpl-pal button:hover svg{color:var(--accent)}
.blk{border:1px solid var(--border);border-radius:11px;margin-bottom:9px;background:var(--surface);overflow:hidden;transition:box-shadow .13s,border-color .13s}
.blk.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.blk.drag{opacity:.45}
.blk.dragover{border-color:var(--accent);border-style:dashed}
.blk-h{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;user-select:none}
.blk-h .hd{display:flex;align-items:center;cursor:grab;color:var(--muted);opacity:.5}
.blk-h .hd:active{cursor:grabbing}
.blk-h .ic{display:flex;align-items:center;color:var(--accent)}
.blk-h .nm{font-weight:600;font-size:13.5px;flex:1;color:var(--text)}
.blk-h .sub{font-size:12px;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk-a{display:flex;gap:1px;opacity:.55;transition:.12s}
.blk:hover .blk-a,.blk.sel .blk-a{opacity:1}
.blk-a button{display:flex;align-items:center;border:0;background:none;cursor:pointer;color:var(--muted);padding:5px;border-radius:7px;line-height:0}
.blk-a button:hover{background:var(--surface-2);color:var(--text)}
.blk-a button.del:hover{color:#e5484d}
.blk-a button:disabled{opacity:.25;cursor:default}
.blk-body{padding:2px 13px 13px;border-top:1px solid var(--border);background:var(--surface-2)}
.tf{display:block;margin-top:10px}
.tf>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.tf .inp,.tf textarea.inp{width:100%;box-sizing:border-box}
.tpl-empty{border:1.5px dashed var(--border);border-radius:10px;padding:26px;text-align:center;color:var(--muted);font-size:13px}
.rt-tb{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.rt-tb button{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer;color:var(--text);min-width:30px;line-height:1}
.rt-tb button:hover{border-color:var(--accent);color:var(--accent)}
.rt{margin-top:8px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:64px;background:var(--surface);font-size:14px;line-height:1.5;color:var(--text)}
.rt:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.rt a{color:var(--accent)}
.rt:empty::before{content:attr(data-ph);color:var(--muted)}
.seg.mini button{padding:5px 9px;display:inline-flex;align-items:center;justify-content:center}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.srow>span{font-size:12px;color:var(--muted)}
.lnk{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px}
.lnk:hover{color:var(--accent)}
/* Библиотека шаблонов — компактный список */
.tpl-pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-weak);color:var(--accent);font-weight:600}
.tpl-pill.muted{background:var(--surface-2);color:var(--muted)}
.tgrp{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;background:var(--surface)}
.tgrp-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.tgrp-h .ti{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--text)}
.tgrp-h .n{color:var(--muted);font-weight:500}
.tgrp-h .add{font-size:13px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:5px 8px;border-radius:7px}
.tgrp-h .add:hover{background:var(--accent-weak)}
.trow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--border);cursor:pointer;transition:.1s}
.trow:first-child{border-top:0}
.trow:hover{background:var(--surface-2)}
.trow .st{width:14px;flex:0 0 auto;text-align:center;color:var(--accent);font-size:13px}
.trow .mn{flex:1;min-width:0}
.trow .nm{font-weight:600;font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .mt{font-size:12px;color:var(--muted);margin-top:1px}
.trow .ac{display:flex;gap:6px;flex:0 0 auto;opacity:.4;transition:.1s}
.trow:hover .ac{opacity:1}
.trow .ac button{font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:.1s}
.trow .ac button:hover{border-color:var(--accent);color:var(--accent)}
.trow .ac button.danger:hover{border-color:#e5484d;color:#e5484d}
.trow.def{cursor:default}
.trow.def:hover{background:transparent}
.trow.def .mt{font-style:normal}
/* Авторассылки — карточки сценариев */
.scen{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1px solid var(--glass-border);border-radius:var(--r);background:var(--surface);padding:20px 22px;margin-bottom:14px;cursor:pointer;
  backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);box-shadow:var(--shadow);transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s}
.scen:hover{border-color:transparent;box-shadow:var(--glow),var(--shadow-lg);transform:translateY(-2px)}
.scen-name{font-weight:700;font-size:17px;color:var(--text)}
.scen-what{font-size:14px;color:var(--text);margin-top:7px;line-height:1.45}
.scen-meta{font-size:13px;color:var(--muted);margin-top:9px}
.scen-meta b{color:var(--text);font-weight:600}
.scen-status{font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:20px}
.scen-status.on{background:rgba(34,170,85,.16);color:#22a555}
.scen-status.off{background:var(--surface-2);color:var(--muted)}
.scen-intro{border:0;background:var(--accent-weak);margin-bottom:16px}
.scen-intro b{color:var(--text)}
.scen-side{display:flex;align-items:center;gap:16px;flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.scen{flex-direction:column;align-items:stretch}.scen-side{justify-content:space-between}}
/* Конструктор сценария — условия */
.cond{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--border)}
.cond:first-child{border-top:0}
.cond-ic{width:26px;height:26px;flex:0 0 auto;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-weight:700}
.cond.tune .cond-ic{background:var(--accent-weak);color:var(--accent)}
.cond.fixed .cond-ic{background:rgba(34,170,85,.16);color:#22a555}
.cond-t{flex:1;font-size:14px;color:var(--text);line-height:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cond.fixed .cond-t{color:var(--muted)}
.cond-inp{width:74px;padding:5px 8px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font:inherit;text-align:center}
.cond-inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
</style>
</head>
<body>
<aside>
  <div class="logo"><div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 7.5 9 6 9-6"/></svg></div>
    <div><b>GrosterHIT</b><span>groster.me</span></div></div>
  <nav id="nav"></nav>
  <div class="sidefoot">GrosterHIT · v1</div>
</aside>

<main>
  <div class="topbar">
    <button class="burger" id="burger" title="Свернуть меню" aria-label="Свернуть меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="crumb"><h1 id="title">—</h1><small id="subtitle"></small></div>
    <span class="updated" id="updated"></span>
    <button class="themebtn" id="themebtn" title="Сменить тему"></button>
    <button class="themebtn" id="logoutbtn" title="Выйти" aria-label="Выйти">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>
  <div class="loadbar" id="loadbar"></div>
  <div class="view" id="view"></div>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let _pending=0;
const j = (u,o) => { _pending++; document.getElementById('loadbar').classList.add('on');
  return fetch(u,o).then(r=>{ if(r.status===401){ location='/login'; throw new Error('unauthorized'); }
      if(!r.ok) throw new Error(`${(o&&o.method)||'GET'} ${u} → HTTP ${r.status}`); return r.json(); })
    .finally(()=>{ if(--_pending<=0){_pending=0; document.getElementById('loadbar').classList.remove('on');} }); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => v==null ? '—' : (v*100).toFixed(v<0.02?2:1)+'%';
const rub = v => v==null ? '—' : Math.round(v).toLocaleString('ru-RU')+' ₽';
const num = v => (+v||0).toLocaleString('ru-RU');

const SVC = {
  best_offer:{ru:'Best Offer', sub:'плановая рассылка топ-5 по категориям'},
  cart:{ru:'Брошенная корзина', sub:'событийная, near-real-time'},
  postsale:{ru:'Постпродажа', sub:'отложенное письмо после заказа'},
};

const NAV = [
  {id:'overview', t:'Рабочий стол', icon:'grid'},
  {g:'Лиды'},
  {id:'leads', t:'Все лиды', icon:'users'},
  {g:'Инструменты'},
  {id:'services', t:'Авторассылки', icon:'list'},
  {id:'feeds', t:'Товарные рекомендации', icon:'feed'},
  {id:'templates', t:'Шаблоны писем', icon:'layers'},
  {id:'wheel', t:'Колесо фортуны', icon:'gift'},
  {g:'Отчёты'},
  {id:'report', t:'Эффективность', icon:'doc'},
  {id:'analytics', t:'Аналитика', icon:'chart'},
  {id:'emails', t:'Журнал писем', icon:'mail'},
  {g:'Система'},
  {id:'settings', t:'Настройки', icon:'sliders'},
  {id:'integration', t:'Интеграция', icon:'plug'},
];
const ICON = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S9 2 6.5 4 8 8 12 8zM12 8s3-6 5.5-4S16 8 12 8z"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  doc:'<path d="M6 2h9l4 4v16H6zM14 2v5h5"/><path d="M9 13h6M9 17h6"/>',
  layers:'<path d="m12 2 9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  feed:'<path d="M4 4h16v6H4zM4 14h16v6H4z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  plug:'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0zM12 17v5"/>',
};

let cache = {};       // config, kpi, feeds, integration
let toastT;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* Theme */
function applyTheme(mode){
  const root=document.documentElement;
  root.classList.remove('light','dark');
  if(mode) root.classList.add(mode);
  const dark = mode==='dark' || (!mode && matchMedia('(prefers-color-scheme:dark)').matches);
  $('themebtn').innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4 4l1.5 1.5M18.5 18.5 20 20M1 12h2M21 12h2M4 20l1.5-1.5M18.5 5.5 20 4"/></svg> Светлая'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> Тёмная';
}
function toggleTheme(){
  const cur = localStorage.theme || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const next = cur==='dark'?'light':'dark';
  localStorage.theme=next; applyTheme(next);
}

/* Nav */
function buildNav(){
  $('nav').innerHTML = NAV.map(n=> n.g
    ? `<div class="navgroup">${esc(n.g)}</div>`
    : `<a class="navlink" data-id="${n.id}" href="#/${n.id}" title="${esc(n.t)}">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[n.icon]}</svg>
         <span>${esc(n.t)}</span>${n.svc?`<span class="sdot" data-sdot="${n.svc}"></span>`:''}</a>`
  ).join('');
}
function markActive(route){
  document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('active', a.dataset.id===route));
}

/* Data */
async function loadCore(){
  const [config,kpi,feeds,integration,meta] = await Promise.all([
    j('/admin/config'), j('/admin/kpi'), j('/admin/feeds-status'), j('/admin/integration'), j('/admin/scenario-meta')]);
  cache={config,kpi,feeds,integration,meta};
  config.forEach(s=>{const d=document.querySelector(`[data-sdot="${s.service}"]`); if(d)d.className='sdot'+(s.enabled?'':' off');});
  $('updated').textContent='обновлено '+new Date().toLocaleTimeString('ru-RU');
}

/* Components */
function meter(name,val,bench,status){
  const ratio=(val!=null&&bench)?Math.max(0,Math.min(val/bench,1)):0;
  const cls={green:'green',yellow:'yellow',red:'red'}[status]||'green';
  return `<div class="meter"><div class="meter-row"><span class="name">${name}</span>
    <span class="val">${pct(val)} <span class="b">/ ${pct(bench)}</span></span></div>
    <div class="rail"><div class="fill ${cls}" style="width:${(ratio*100).toFixed(0)}%"></div><div class="tick"></div></div></div>`;
}
function kpiCard(svc,d){
  const m=d.metrics,b=d.benchmark||{},st=d.status||{};
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div class="svc-name">${esc(SVC[svc]?.ru||svc)}</div>
    <div style="display:flex;gap:18px;text-align:right">
      <div><div class="mono" style="font-size:18px;font-weight:600">${num(m.sent)}</div><div class="svc-sub">отпр.</div></div>
      <div><div class="mono" style="font-size:18px;font-weight:600">${m.avg_check?rub(m.avg_check):'—'}</div><div class="svc-sub">ср. чек</div></div>
    </div></div>
    ${meter('Доставляемость',m.deliverability,b.deliverability,st.deliverability)}
    ${meter('Open rate',m.open,b.open,st.open)}
    ${meter('CTR',m.ctr,b.ctr,st.ctr)}
    ${meter('Конверсия',m.conversion,b.conversion,st.conversion)}</div>`;
}
function logDate(iso){ return iso?new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'; }
function logsTable(rows){
  if(!rows.length) return '<div class="tablewrap"><div class="empty">Писем пока нет.</div></div>';
  return `<div class="tablewrap"><table><thead><tr>
    <th>Отправлено</th><th>Пользователь</th><th>Сервис</th><th>Статус</th><th>Товары</th><th>Заказ</th><th>Доход</th></tr></thead><tbody>`+
    rows.map(e=>`<tr onclick="location.hash='#/lead/'+encodeURIComponent('${esc(e.user_id)}')" style="cursor:pointer">
      <td class="mono">${esc(logDate(e.sent_at))}</td><td class="mono">${esc(e.user_id)}</td>
      <td>${esc(SVC[e.service]?.ru||e.service)}</td><td><span class="pill ${esc(e.status)}">${esc(e.status)}</span></td>
      <td class="mono">${esc((e.product_ids||[]).join(', '))}</td><td class="mono">${esc(e.attributed_order_id||'—')}</td>
      <td class="mono">${e.revenue?rub(e.revenue):'—'}</td></tr>`).join('')+`</tbody></table></div>`;
}
function freshInfo(iso){ if(!iso)return{t:'—',stale:true};
  const d=new Date(iso),h=(Date.now()-d)/36e5;
  return{t:d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),stale:h>24}; }
function feedTiles(f){
  const p=freshInfo(f.products.last_updated),t=freshInfo(f.top5.last_updated),o=freshInfo(f.orders.last_order);
  return `<div class="grid tiles">
    <div class="tile"><div class="l">Каталог</div><div class="n">${num(f.products.count)}</div><div class="s ${p.stale?'stale':''}">обновлён ${esc(p.t)}</div></div>
    <div class="tile"><div class="l">Топ-5 категорий</div><div class="n">${num(f.top5.categories)}</div><div class="s ${t.stale?'stale':''}">обновлён ${esc(t.t)}</div></div>
    <div class="tile"><div class="l">Заказы</div><div class="n">${num(f.orders.count)}</div><div class="s">последний ${esc(o.t)}</div></div>
    <div class="tile"><div class="l">Подписчики</div><div class="n">${num(f.subscribers)}</div><div class="s">в базе</div></div></div>`;
}

/* Views */
function setTitle(t,s){ $('title').textContent=t; $('subtitle').textContent=s||''; }

async function viewOverview(){
  setTitle('Рабочий стол','сводка по всем сервисам');
  await loadCore();
  const {config,kpi,feeds}=cache;
  const on=config.filter(s=>s.enabled).length;
  const totSent=Object.values(kpi).reduce((a,d)=>a+(+d.metrics.sent||0),0);
  const revenue=Object.values(kpi).reduce((a,d)=>a+(+d.metrics.revenue||0),0);
  const [logs,q]=await Promise.all([j('/admin/logs?limit=8'),j('/admin/queue')]);
  const qrows=q.by_service.map(r=>`<tr><td>${esc(SVC[r.service]?.ru||r.service)}</td>
    <td class="mono">${num(r.scheduled)}</td><td class="mono">${num(r.queued)}</td>
    <td class="mono">${num(r.sent)}</td><td class="mono">${num(r.cancelled)}</td></tr>`).join('');
  $('view').innerHTML=`
    <section><div class="grid tiles">
      <div class="tile"><div class="l">Активные сервисы</div><div class="n">${on}/${config.length}</div><div class="s">из ${config.length} сценариев</div></div>
      <div class="tile"><div class="l">Отправлено писем</div><div class="n">${num(totSent)}</div><div class="s">за всё время</div></div>
      <div class="tile"><div class="l">Привязанный доход</div><div class="n">${rub(revenue)}</div><div class="s">атрибуция кликов</div></div>
      <div class="tile"><div class="l">В очереди</div><div class="n">${num(q.pending_total)}</div><div class="s">ждут отправки</div></div>
    </div></section>
    <section><div class="eyebrow"><h2>Актуальность фидов</h2><span class="rule"></span></div>${feedTiles(feeds)}</section>
    <section><div class="eyebrow"><h2>Очередь отправки</h2><span class="rule"></span></div>
      <div class="tablewrap"><table><thead><tr><th>Сервис</th><th>Ждёт</th><th>В очереди</th><th>Отправлено</th><th>Отменено</th></tr></thead>
      <tbody>${qrows||'<tr><td colspan=5 class="empty">Очередь пуста.</td></tr>'}</tbody></table></div></section>
    <section><div class="eyebrow"><h2>Последние письма</h2><span class="rule"></span></div>${logsTable(logs)}</section>`;
}

const dt = iso => iso ? new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const SCEN_WHAT={
  best_offer:'Раз в заданный период сама отправляет клиенту подборку популярных товаров из его категорий.',

function fieldRow(svc,k,v,fm){
  const m=fm[k]||{type:'number',label:k};
  const label=esc(m.label||k);
  if(m.type==='text')
    return `<div class="field"><span class="k">${label}</span>
      <input class="inp wide" type="text" value="${esc(v)}" onchange="saveParam('${svc}','${k}',this.value,'text')"></div>`;
  if(m.type==='template')
    return `<div class="field"><span class="k">${label}</span>
      <select class="inp" onchange="saveParam('${svc}','${k}',this.value,'text')">
        ${['default','minimal'].map(t=>`<option value="${t}" ${v===t?'selected':''}>${t}</option>`).join('')}</select></div>`;
  return `<div class="field"><span class="k">${label}</span>
    <input class="inp" type="number" value="${esc(v)}" onchange="saveParam('${svc}','${k}',this.value,'number')"></div>`;
}

async function loadReach(svc){

async function sendTest(svc){
  const email=($('testEmail')||{}).value||'';
  if(!email){ toast('Укажите email'); return; }
  const r=await j('/admin/scenario/'+encodeURIComponent(svc)+'/test',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
  toast(r.error?('Ошибка ESP: '+r.error):(!r.ok?'Ошибка отправки':(r.live?'Тест отправлен на '+email:'Тест записан в лог (dev, SMTP не настроен)')));
}

const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const METRICS={
  sent:{label:'Отправлено', fmt:num, val:d=>d.sent},
  open:{label:'Open rate', fmt:pct, val:d=>d.delivered?d.opened/d.delivered:0},
  ctr:{label:'CTR', fmt:pct, val:d=>d.delivered?d.clicked/d.delivered:0},
  conversion:{label:'Конверсия', fmt:pct, val:d=>d.delivered?d.orders/d.delivered:0},
  revenue:{label:'Доход', fmt:rub, val:d=>d.revenue},
};
const HOURS=Array.from({length:24},(_,h)=>String(h));
let trend={service:'', metric:'sent', dim:'weekday'};
async function renderTrend(){
  const isHour=trend.dim==='hour';
  const url=(isHour?'/admin/trends/hour':'/admin/trends/weekday')+(trend.service?('?service='+encodeURIComponent(trend.service)):'');
  const data=await j(url);
  const labels=isHour?HOURS:DOW;
  const lbl=i=>isHour?labels[i]+':00':DOW[i];
  const M=METRICS[trend.metric];
  const vals=data.map(M.val);
  const max=Math.max(...vals,0);
  const bars=data.map((d,i)=>{
    const v=vals[i], h=max>0?Math.round(v/max*100):0, wk=(!isHour&&i>=5)?' weekend':'';
    const tip=`${lbl(i)}: отпр ${num(d.sent)}, откр ${num(d.opened)}, клик ${num(d.clicked)}, заказы ${num(d.orders)}, доход ${rub(d.revenue)}`;
    return `<div class="bar-col" title="${esc(tip)}">
      <div class="bar-val">${v?M.fmt(v):''}</div>
      <div class="bar${wk}" style="height:${h}%"></div>
      <div class="bar-lbl${wk}"${isHour?' style="font-size:10px"':''}>${labels[i]}</div></div>`;
  }).join('');
  const rows=data.map((d,i)=>`<tr><td class="bar-lbl${(!isHour&&i>=5)?' weekend':''}" style="margin:0">${lbl(i)}</td>
    <td class="mono">${num(d.sent)}</td><td class="mono">${num(d.delivered)}</td>
    <td class="mono">${d.delivered?pct(d.opened/d.delivered):'—'}</td>
    <td class="mono">${d.delivered?pct(d.clicked/d.delivered):'—'}</td>
    <td class="mono">${d.delivered?pct(d.orders/d.delivered):'—'}</td>
    <td class="mono">${d.revenue?rub(d.revenue):'—'}</td></tr>`).join('');
  $('trendbox').innerHTML=`
    <div class="card"><div class="chart${isHour?' dense':''}">${bars}</div></div>
    <div class="tablewrap" style="margin-top:14px"><table><thead><tr>
      <th>${isHour?'Час':'День'}</th><th>Отправлено</th><th>Доставлено</th><th>Open</th><th>CTR</th><th>Конверсия</th><th>Доход</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function priceRu(v){ return v==null?'—':v.toLocaleString('ru-RU',{minimumFractionDigits:(v%1?2:0),maximumFractionDigits:2})+' ₽'; }
let recCat='', recView='cards', recProblems=false;
function setRecView(v){ recView=v; viewFeeds(); }
function recStatusPill(pr){
  if(!pr.exists) return '<span class="pill unsubscribed">нет в каталоге</span>';
  if(!pr.in_stock) return '<span class="pill queued">нет в наличии</span>';
  return '<span class="pill sent">в наличии</span>';
}

  let cats=recCat?rec.categories.filter(c=>c.category_id===recCat):rec.categories;
  // Фильтр «только проблемные»: оставляем позиции, которые не попадут в письмо.
  if(recProblems) cats=cats.map(c=>({...c, products:c.products.filter(p=>!p.usable)})).filter(c=>c.products.length);

  const catCards = cats.map(c=>{
    const items=c.products.map(pr=>{
      const dim = pr.usable ? '' : ' dim';
      const img = pr.image_url
        ? `<img class="recimg" src="${esc(pr.image_url)}" alt="">`

function trackSnippet(){
  const o=location.origin;
  return `<script>
  window.grConfig = { clid: 'groster', wheel: true, autoform: true };
  (function(){ var s=document.createElement('script'); s.async=true;
    s.src='${o}/track.js?ver='+Math.floor(Date.now()/1e8);
    var f=document.getElementsByTagName('script')[0]; f.parentNode.insertBefore(s,f); })();
<\/script>`;
}
function copyFrom(id){ const t=$(id); if(!t) return;
  const done=()=>toast('Код скопирован');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done,()=>{t.select();done();});
  else { t.select(); done(); } }

async function renderTemplateList(){

function setListTab(s){ tplListTab=s; drawTemplateList(); }
function drawTemplateList(){
  const data=tplListData;
  if(!data||!Array.isArray(data.services)){ $('view').innerHTML=`<section><div class="tpl-empty">Не удалось загрузить шаблоны.</div></section>`; return; }
  const svc=data.services.find(s=>s.service===tplListTab)||data.services[0];
  const fmt=d=>{ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}); }catch(e){ return '—'; } };
  const q=n=>String(n).replace(/'/g,"\\'");
  const row=(t,draft)=>{
    const meta=(draft?'без типа':(t.is_active?'активный':'не активен'))+` · создан ${fmt(t.created_at)} · ${t.used} отпр.`;
    const act=(!draft&&!t.is_active)?`<button onclick="activateTpl(${t.id})">Активировать</button>`:'';
    return `<div class="trow ${t.is_active?'active':''}" onclick="openTemplate(${t.id})">

      <div class="ac" onclick="event.stopPropagation()">${act}
        <button class="danger" onclick="deleteTpl(${t.id},'${q(esc(t.name))}')">Удалить</button></div>
    </div>`;
  };
  const defRow=svc=>`<div class="trow def">
    <span class="st"></span>
    <div class="mn"><div class="nm" style="color:var(--muted)">Стандартный шаблон</div>
      <div class="mt">используется по умолчанию — создайте свой, чтобы заменить</div></div>
    <div class="ac" style="opacity:1"><button onclick="createTemplate('${svc.service}')">Создать</button></div></div>`;
  const tabs=data.services.map(s=>`<button class="${s.service===tplListTab?'active':''}" onclick="setListTab('${s.service}')">${esc(s.ru)}${s.templates.length?` · ${s.templates.length}`:''}</button>`).join('');
  const scenGrp=`<div class="tgrp">
    <div class="tgrp-h"><div class="ti">${esc(svc.ru)} <span class="n">${svc.templates.length||'—'}</span>
      ${svc.using_default?'<span class="tpl-pill muted">стандартный</span>':''}</div>
      <button class="add" onclick="createTemplate('${svc.service}')">+ Новый шаблон</button></div>
    ${svc.templates.map(t=>row(t,false)).join('')}${svc.using_default?defRow(svc):''}</div>`;
  const drafts=data.drafts||[];
  const draftGrp=`<div class="tgrp">
    <div class="tgrp-h"><div class="ti">Мои шаблоны <span class="n">без типа</span></div>
      <button class="add" onclick="createTemplate('')">+ Создать шаблон</button></div>
    ${drafts.length?drafts.map(t=>row(t,true)).join('')
      :'<div class="trow def"><span class="st"></span><div class="mn"><div class="mt">Черновиков нет. Создайте свой шаблон и прикрепите к любому сценарию.</div></div></div>'}</div>`;
  $('view').innerHTML=`<section style="max-width:820px">
    <div class="seg" style="margin-bottom:16px">${tabs}</div>
    ${scenGrp}${draftGrp}</section>`;
}

function blkCard(b,i){

  return `<div class="blk ${sel?'sel':''}" draggable="true"
      ondragstart="tplDrag=${i};this.classList.add('drag')" ondragend="this.classList.remove('drag')"

      <span class="ic">${ic(BICON[b.type]||BICON.text,17)}</span>
      <span class="nm">${m.ru}</span><span class="sub">${esc(blkSub(b))}</span>
      <span class="blk-a">
        ${act(`moveBlock(${i},-1)`,AICON.up,'Выше',i===0)}

  </div>`;
}
function blkInspector(b,i){

    +styleRow('Размер',sizeSeg(i,b.size))+styleRow('Интервал',lineSeg(i,b.lh))+styleRow('Выравнивание',alignSeg(i,b.align))
    +styleRow('Шрифт',fontCtl(i,b.font))+styleRow('Цвет',colorCtl(i,b.color,'#333333'))+boxRows(i,b);

    +styleRow('Выравнивание',alignSeg(i,b.align||'center'))+boxRows(i,b);

  if(b.type==='promo') return inp('code','Промокод',b.code)+inp('caption','Подпись (необязательно)',b.caption)+boxRows(i,b);
  if(b.type==='social') return inp('vk','ВКонтакте — ссылка',b.vk)+inp('telegram','Telegram — ссылка',b.telegram)+inp('whatsapp','WhatsApp — ссылка',b.whatsapp)+inp('instagram','Instagram — ссылка',b.instagram)+boxRows(i,b);
  if(b.type==='columns') return `<div class="tf"><span>Левая колонка</span>${richTb(i,'left')}
      <div class="rt" contenteditable="true" data-ph="Текст…" oninput="tplBlocks[${i}].left=this.innerHTML;tplTouch()" onblur="renderBuilder()">${b.left||''}</div></div>
    <div class="tf"><span>Правая колонка</span>${richTb(i,'right')}
      <div class="rt" contenteditable="true" data-ph="Текст…" oninput="tplBlocks[${i}].right=this.innerHTML;tplTouch()" onblur="renderBuilder()">${b.right||''}</div></div>`+boxRows(i,b);
  if(b.type==='image'){

    return `<label class="tf"><span>URL картинки</span>
        <input class="inp" type="text" value="${esc(b.src||'')}" placeholder="Ссылка или загрузите файл ниже" oninput="tplBlocks[${i}].src=this.value;tplTouch()" onchange="renderBuilder()"></label>
      <div class="tf"><span>Файл</span>
        <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" id="tplfile${i}" style="display:none" onchange="tplUpload(${i},this)">
        <button class="btn" type="button" style="width:100%" onclick="document.getElementById('tplfile${i}').click()">Загрузить изображение</button>
        ${thumb}</div>`
      + inp('alt','Alt-текст',b.alt) + inp('url','Ссылка (необязательно)',b.url)
      + styleRow('Скругление',radiusSeg(i,b.radius)) + boxRows(i,b);
  }
  if(b.type==='spacer') return `<label class="tf"><span>Высота, px</span><input class="inp" type="number" min="0" max="120" value="${b.h||16}" oninput="tplBlocks[${i}].h=+this.value;tplTouch()"></label>`;
  if(b.type==='products') return `<div class="svc-sub" style="padding-top:8px">Автоподстановка топ-5 товаров сценария из фида 1С. Стиль карточек и текст кнопки — во вкладке «Оформление».</div>`;
  return `<div class="svc-sub" style="padding-top:8px">Без настроек.</div>`;
}
function richTb(){
  const b=(cmd,label,title)=>`<button type="button" title="${title}" onmousedown="event.preventDefault()" onclick="rtCmd('${cmd}')">${label}</button>`;
  return `<div class="rt-tb">${b('bold','<b>Ж</b>','Жирный')}${b('italic','<i>К</i>','Курсив')}${b('underline','<u>П</u>','Подчёркнутый')}${b('insertUnorderedList','• список','Маркированный список')}<button type="button" title="Ссылка" onmousedown="event.preventDefault()" onclick="rtLink()">🔗 ссылка</button>${b('removeFormat','✕','Убрать формат')}</div>`;
}
function afterRt(){ const el=document.activeElement; if(el&&el.classList&&el.classList.contains('rt')) el.dispatchEvent(new Event('input')); }
function setBlk(i,key,val){ tplBlocks[i][key]=val; tplDirty=true; renderBuilder(); tplPreview(); }
function alignSeg(i,cur){ const A={left:'<path d="M4 6h16M4 12h10M4 18h13"/>',center:'<path d="M4 6h16M7 12h10M6 18h12"/>',right:'<path d="M4 6h16M10 12h10M7 18h13"/>'};

function sizeSeg(i,cur){ return `<div class="seg mini">${[['s',12],['m',14],['l',17]].map(a=>`<button type="button" class="${(cur||'m')===a[0]?'active':''}" onclick="setBlk(${i},'size','${a[0]}')"><span style="font-size:${a[1]}px;line-height:1;font-weight:700">A</span></button>`).join('')}</div>`; }
function colorCtl(i,cur,def){ const c=cur||def; return `<span style="display:inline-flex;gap:6px;align-items:center"><input type="color" value="${c}" oninput="tplBlocks[${i}].color=this.value;tplTouch()" onchange="renderBuilder()" style="width:36px;height:28px;border:1px solid var(--border);border-radius:7px;padding:2px;background:none;cursor:pointer">${cur?`<button type="button" class="lnk" onclick="setBlk(${i},'color','')">сброс</button>`:''}</span>`; }
function styleRow(l,ctl){ return `<div class="srow"><span>${l}</span>${ctl}</div>`; }
function fontCtl(i,cur){ const F=[['','Обычный'],['serif','Серифный'],['mono','Моноширинный'],['rounded','Гротеск']];
  return `<select class="inp" style="width:auto;min-width:150px;padding:6px 10px" onchange="setBlk(${i},'font',this.value)">${F.map(f=>`<option value="${f[0]}" ${(cur||'')===f[0]?'selected':''}>${f[1]}</option>`).join('')}</select>`; }
function lineSeg(i,cur){ const L={s:'<path d="M5 8h14M5 12h14M5 16h14"/>',m:'<path d="M5 7h14M5 12h14M5 17h14"/>',l:'<path d="M5 6h14M5 12h14M5 18h14"/>'};
  return `<div class="seg mini">${['s','m','l'].map(v=>`<button type="button" class="${(cur||'m')===v?'active':''}" onclick="setBlk(${i},'lh','${v}')" title="Интервал">${ic(L[v],15)}</button>`).join('')}</div>`; }
function bgCtl(i,cur){ return cur
  ? `<span style="display:inline-flex;gap:6px;align-items:center"><input type="color" value="${cur}" oninput="tplBlocks[${i}].bg=this.value;tplTouch()" onchange="renderBuilder()" style="width:36px;height:28px;border:1px solid var(--border);border-radius:7px;padding:2px;background:none;cursor:pointer"><button type="button" class="lnk" onclick="setBlk(${i},'bg','')">убрать</button></span>`
  : `<button type="button" class="lnk" onclick="setBlk(${i},'bg','#f5f0fb')">добавить фон</button>`; }
function borderCtl(i,cur){ return cur
  ? `<span style="display:inline-flex;gap:6px;align-items:center"><input type="color" value="${cur}" oninput="tplBlocks[${i}].border=this.value;tplTouch()" onchange="renderBuilder()" style="width:36px;height:28px;border:1px solid var(--border);border-radius:7px;padding:2px;background:none;cursor:pointer"><button type="button" class="lnk" onclick="setBlk(${i},'border','')">убрать</button></span>`
  : `<button type="button" class="lnk" onclick="setBlk(${i},'border','#e6ebf3')">добавить рамку</button>`; }
function spaceSeg(i,cur){ const O=[['','—'],['s','S'],['m','M'],['l','L']];
  return `<div class="seg mini">${O.map(o=>`<button type="button" class="${(cur||'')===o[0]?'active':''}" onclick="setBlk(${i},'space','${o[0]}')" title="Отступы сверху/снизу">${o[1]}</button>`).join('')}</div>`; }
function radiusSeg(i,cur){ const R=[['none','0'],['s','4px'],['l','7px']];
  return `<div class="seg mini">${R.map(r=>`<button type="button" class="${(cur||'s')===r[0]?'active':''}" onclick="setBlk(${i},'radius','${r[0]}')" title="Скругление"><span style="display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-radius:${r[1]}"></span></button>`).join('')}</div>`; }

function rtCmd(cmd){ document.execCommand(cmd,false,null); afterRt(); }
function rtLink(){ const url=prompt('Ссылка (https://…)'); if(url){ document.execCommand('createLink',false,url); afterRt(); } }
function tplTouch(){ tplDirty=true; const d=$('tplDirtyDot'); if(d)d.style.opacity=1; clearTimeout(window._tpv); window._tpv=setTimeout(tplPreview,300); }
function reBuild(){ tplDirty=true; renderBuilder(); tplPreview(); }
function addBlock(t){ const at=(tplSel>=0&&tplSel<tplBlocks.length)?tplSel+1:tplBlocks.length; tplBlocks.splice(at,0,newBlock(t)); tplSel=at; reBuild(); }
function delBlock(i){ tplBlocks.splice(i,1); if(tplSel>=tplBlocks.length)tplSel=tplBlocks.length-1; reBuild(); }
function dupBlock(i){ tplBlocks.splice(i+1,0,JSON.parse(JSON.stringify(tplBlocks[i]))); tplSel=i+1; reBuild(); }
function moveBlock(i,d){ const k=i+d; if(k<0||k>=tplBlocks.length)return; const t=tplBlocks[i];tplBlocks[i]=tplBlocks[k];tplBlocks[k]=t; tplSel=k; reBuild(); }
function selBlock(i){ tplSel=(tplSel===i?-1:i); renderBuilder(); tplPreview(); }
function tplDropOn(i){ if(tplDrag<0||tplDrag===i){tplDrag=-1;return;} const b=tplBlocks.splice(tplDrag,1)[0]; tplBlocks.splice(i,0,b); tplSel=i; tplDrag=-1; reBuild(); }
async function tplUpload(i,input){
  const file=input.files&&input.files[0]; if(!file) return;
  if(file.size>3000000){ toast('Файл больше 3 МБ'); input.value=''; return; }
  toast('Загрузка…');
  const data=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(file); });
  const resp=await j('/admin/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,data})});
  if(resp&&resp.ok&&resp.url){ tplBlocks[i].src=resp.url; tplDirty=true; renderBuilder(); tplPreview(); toast('Изображение загружено'); }
  else { toast('Ошибка загрузки'+(resp&&resp.reason?': '+resp.reason:'')); }
  input.value='';
}
async function tplPreview(){
  const f=$('tplframe'); if(!f) return;
  try{ const r=await fetch('/admin/template/render',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({service:tplSvc||'best_offer',blocks:tplBlocks,look:tplLook})}); f.srcdoc=await r.text(); }catch(e){}
}
async function saveBlocks(){
  const r=await j('/admin/template/'+encodeURIComponent(tplId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({blocks:tplBlocks,name:tplName})});
  if(r&&r.ok){ tplDirty=false; toast('Шаблон сохранён'); renderBuilder(); } else toast('Ошибка сохранения');
}
async function resetBlocks(){

  tplBlocks=null; tplSel=-1; tplDirty=false; viewTemplates();
}

/* Оформление (глобальный бренд-стиль) */

async function saveTplLook(){
  const r=await j('/admin/template-settings',{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({brand_color:tplLook.brand_color,header:tplLook.header,button:tplLook.button,footer:tplLook.footer})});
  toast(r.ok?'Оформление сохранено':'Ошибка сохранения');
}
async function tplTest(){
  const to=($('tpl_test_to')||{}).value||''; if(!to){ toast('Укажите email'); return; }
  const r=await j('/admin/scenario/'+encodeURIComponent(tplSvc)+'/test',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({email:to})});
  toast(r.error?('Ошибка ESP: '+r.error):(!r.ok?'Ошибка':(r.live?'Тест отправлен на '+to:'Тест записан в лог (dev)')));

/* Settings */
function setField(k,v,m){
  const hint = m.restart ? ' <span class="svc-sub">(после перезапуска)</span>' : '';
  if(m.type==='text')
    return `<div class="field"><span class="k">${esc(m.label)}${hint}</span>
      <input class="inp wide" type="text" value="${esc(v)}" onchange="saveSetting('${k}',this.value,'text')"></div>`;
  return `<div class="field"><span class="k">${esc(m.label)}${hint}</span>
    <input class="inp" type="number" value="${esc(v)}" onchange="saveSetting('${k}',this.value,'number')"></div>`;
}
async function saveSetting(k,v,type){
  await j('/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({[k]: type==='number'?+v:v})});
  toast('Сохранено');
}
let settingsTab='mail';
function setSettingsTab(t){ settingsTab=t; viewSettings(); }
/* Колесо фортуны */
let wheelCfg=null, wheelPrevT;
function ensureWheelLib(){ return new Promise(res=>{
  if(window.grosterWheel) return res();
  const s=document.createElement('script'); s.src='/wheel.js'; s.onload=res; s.onerror=res;
  document.head.appendChild(s);
}); }

async function viewWheel(){
  setTitle('Колесо фортуны','виджет захвата email в обмен на скидку');
  await ensureWheelLib();
  wheelCfg = await j('/admin/wheel');            // всегда свежий из БД (несохранённые правки не переживают уход со страницы)
  renderWheel();
}

function wheelTotal(){ return (wheelCfg.prizes||[]).reduce((s,p)=>s+Math.max(0,+p.weight||0),0); }

function renderWheel(){
  const c=wheelCfg, total=wheelTotal();
  const origin=location.origin;
  const snippet=`<script src="${origin}/wheel.js"\n        data-endpoint="${origin}"\n        data-auto="${+c.auto_delay_sec||0}"\n        data-once-days="${+c.once_days||0}"><\/script>`;
  const rows=(c.prizes||[]).map((p,i)=>{
    const prob=total>0?((Math.max(0,+p.weight||0)/total)*100):0;
    const respin=!((p.code||'').trim());
    return `<tr>
      <td><input class="inp wide" value="${esc(p.label||'')}" maxlength="40"
            oninput="wheelPrizeField(${i},'label',this.value)"></td>
      <td><input class="inp" style="width:130px;font-family:ui-monospace,Menlo,monospace" value="${esc(p.code||'')}"
            maxlength="32" placeholder="пусто = «Ещё разок»" oninput="wheelPrizeField(${i},'code',this.value)"></td>
      <td><input class="inp" style="width:72px" type="number" min="0" value="${+p.weight||0}"
            oninput="wheelPrizeField(${i},'weight',this.value)"></td>
      <td class="mono" style="width:64px"><span class="wprob" data-i="${i}">${prob.toFixed(1)}%</span></td>
      <td><input type="color" value="${/^#[0-9a-fA-F]{6}$/.test(p.color||'')?p.color:'#bc39e5'}"
            style="width:44px;height:32px;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;padding:2px"
            onchange="wheelPrizeField(${i},'color',this.value)">
          ${respin?'<span class="pill dev" style="margin-left:6px">спин</span>':''}</td>
      <td><button class="btn" title="Удалить сектор" onclick="wheelDelPrize(${i})" ${(c.prizes||[]).length<=2?'disabled':''}>✕</button></td>
    </tr>`;}).join('');

  $('view').innerHTML=`<section>
    <div class="filters" style="justify-content:space-between">
      <label class="switch" style="display:flex;align-items:center;gap:10px">
        <input type="checkbox" id="wheelEnabled" ${c.enabled?'checked':''} onchange="wheelCfg.enabled=this.checked">
        <span class="track"></span><span class="k">Колесо включено</span></label>
      <button class="btn primary" onclick="saveWheel()">Сохранить</button>
    </div>
  </section>
  <section class="grid" style="grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:20px;align-items:start">
    <div>
      <div class="eyebrow"><h2>Оформление попапа</h2><span class="rule"></span></div>
      <div class="card">
        <div class="field"><span class="k">Заголовок</span>
          <input class="inp wide" id="wheelTitle" value="${esc(c.title||'')}" maxlength="200"
            oninput="wheelCfg.title=this.value"></div>
        <div class="field"><span class="k">Подзаголовок</span>
          <input class="inp wide" id="wheelSub" value="${esc(c.subtitle||'')}" maxlength="300"
            oninput="wheelCfg.subtitle=this.value"></div>
        <div class="grid2">
          <div class="field"><span class="k">Показ не чаще, дней</span>
            <input class="inp" type="number" min="0" value="${+c.once_days||0}"
              oninput="wheelCfg.once_days=+this.value||0" title="0 — показывать каждый заход"></div>
          <div class="field"><span class="k">Авто-открытие, сек</span>
            <input class="inp" type="number" min="0" value="${+c.auto_delay_sec||0}"
              oninput="wheelCfg.auto_delay_sec=+this.value||0" title="задержка перед авто-показом попапа"></div>
        </div>
        <p class="legend">Заголовок допускает HTML: <code>&lt;span class="acc"&gt;…&lt;/span&gt;</code> подсветит жёлтым.</p>
      </div>

      <div class="eyebrow" style="margin-top:20px"><h2>Секторы и шансы</h2><span class="rule"></span>
        <button class="btn" onclick="wheelAddPrize()">+ сектор</button></div>
      <div class="tablewrap"><table><thead><tr>
        <th>Подпись</th><th>Промокод</th><th>Вес</th><th>Шанс</th><th>Цвет</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table></div>
      <p class="legend">«Шанс» = вес сектора ÷ сумма весов. Пустой промокод делает сектор бонусным
        («Ещё разок» — даёт повторный прокрут, приз не выдаётся).</p>

      <div class="eyebrow" style="margin-top:20px"><h2>Интеграция с сайтом</h2><span class="rule"></span></div>
      <div class="card">
        <div class="svc-sub" style="margin-bottom:8px">Вставьте перед <code>&lt;/body&gt;</code> на страницах groster.me — попап откроется сам через заданную задержку:</div>
        <textarea class="inp wide" readonly rows="4" id="wheelSnippet"
          style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;resize:vertical">${esc(snippet)}</textarea>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn" onclick="copyWheelSnippet()">Копировать код</button>
          <a class="btn" href="/wheel" target="_blank">Открыть страницу-лендинг</a>
          <a class="btn" href="/wheel-banner" target="_blank">Готовый баннер</a>
        </div>
        <p class="legend">Кнопку/баннер на сайте можно повесить на <code>grosterWheel.open()</code> — призы и тексты
          виджет берёт отсюда, менять код на сайте не нужно.</p>
      </div>
    </div>

    <div>
      <div class="eyebrow"><h2>Предпросмотр</h2><span class="rule"></span></div>
      <div class="card" style="background:radial-gradient(120% 120% at 50% -10%,#d05cf5 0%,#bc39e5 44%,#6a12a0 100%);border:0">
        <div id="wheelPreview"></div>
      </div>
      <p class="legend">Живой виджет на текущих секторах (офлайн-режим, email не сохраняется). Введите любой
        email и отметьте согласие, чтобы прокрутить.</p>
    </div>
  </section>`;
  mountWheelPreview();
}

function mountWheelPreview(){
  const host=$('wheelPreview'); if(!host||!window.grosterWheel) return;
  // respin выводим из пустого кода — так же, как это сделает сервер при сохранении.
  const prizes=(wheelCfg.prizes||[]).map(p=>({label:p.label,code:(p.code||'').trim(),
    weight:Math.max(0,+p.weight||0),color:p.color,respin:!((p.code||'').trim())}));
  try{ grosterWheel.mount(host,{prizes,endpoint:false}); }catch(e){ host.textContent='—'; }
}
function refreshWheelPreview(){ clearTimeout(wheelPrevT); wheelPrevT=setTimeout(()=>{ mountWheelPreview(); syncWheelSnippet(); },400); }
function syncWheelProb(){ const total=wheelTotal();
  document.querySelectorAll('.wprob').forEach(el=>{ const p=wheelCfg.prizes[+el.dataset.i];
    el.textContent=(total>0?((Math.max(0,+p.weight||0)/total)*100):0).toFixed(1)+'%'; }); }
function syncWheelSnippet(){ const t=$('wheelSnippet'); if(!t) return; const o=location.origin;
  t.value=`<script src="${o}/wheel.js"\n        data-endpoint="${o}"\n        data-auto="${+wheelCfg.auto_delay_sec||0}"\n        data-once-days="${+wheelCfg.once_days||0}"><\/script>`; }

function wheelPrizeField(i,k,v){ const p=wheelCfg.prizes[i]; if(!p) return;
  p[k] = k==='weight' ? (Math.max(0,+v||0)) : v;
  if(k==='weight'||k==='code') syncWheelProb();
  refreshWheelPreview(); }
function wheelAddPrize(){ if((wheelCfg.prizes||[]).length>=12){ toast('Максимум 12 секторов'); return; }
  const pal=['#bc39e5','#fecc00','#35cc00','#fc6631'];
  wheelCfg.prizes.push({label:'Новый приз',code:'',weight:5,color:pal[wheelCfg.prizes.length%4]});
  renderWheel(); }
function wheelDelPrize(i){ if((wheelCfg.prizes||[]).length<=2){ toast('Нужно минимум 2 сектора'); return; }
  wheelCfg.prizes.splice(i,1); renderWheel(); }
function copyWheelSnippet(){ const t=$('wheelSnippet'); if(!t) return;
  const done=()=>toast('Код скопирован');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done,()=>{t.select();done();});
  else { t.select(); done(); } }
async function saveWheel(){
  const r=await j('/admin/wheel',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(wheelCfg)});
  if(r.ok){ toast('Колесо сохранено — изменения уже на сайте'); wheelCfg=await j('/admin/wheel'); renderWheel(); }
  else toast('Ошибка: '+(r.reason||'')); }

  } else {
    const st=(ok,on,off)=>`<span class="pill ${ok?'live':'dev'}">${ok?esc(on):off}</span>`;
    const ro=s.readonly;
    $('settingsBody').innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">

        <div class="svc-name" style="margin-bottom:8px">Почта</div>

        <div class="svc-sub" style="margin-top:10px">Провайдер и SMTP — на вкладке «Почта».</div>
      </div>
      <div class="card">
        <div class="svc-name" style="margin-bottom:8px">1С (каталог / заказы)</div>
        <div class="field"><span class="k">Статус (pull)</span>${st(ro.onec_configured, 'подключена', 'не задана — push-фиды /feeds/*')}</div>
        <div class="field"><span class="k">Base URL</span>
          <input class="inp wide" id="onec_base_url" type="text" placeholder="https://1c.groster.me/base/hs/grosterhit/v1" value="${esc(ro.onec_base_url||'')}"></div>
        <div class="field"><span class="k">Токен (Bearer)</span>
          <input class="inp wide" id="onec_token" type="password" placeholder="${ro.onec_token_set?'●●●●● (сохранён, оставьте пустым)':'не задан'}"></div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn primary" onclick="saveOnec()">Сохранить подключение</button>
          <button class="btn" onclick="testOnec()">Проверить связь</button>
        </div>
        <div id="onec_test_result" class="svc-sub" style="margin-top:10px"></div>
        <div class="svc-sub" style="margin-top:6px">Пустой Base URL → берётся значение из .env; пусто и там → push-фиды /feeds/*. Токен хранится только на сервере и наружу не отдаётся. Проверка связи использует сохранённое подключение — сначала сохраните. Ручная «Синхронизировать из 1С» подхватывает правки сразу; периодическая — после перезапуска воркеров.</div>

  const patch={base_url:(($('onec_base_url')||{}).value||'').trim()};
  const tk=($('onec_token')||{}).value; if(tk) patch.token=tk;
  const r=await j('/admin/onec-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
  toast(r.ok?'Подключение к 1С сохранено':`Ошибка: ${r.reason||''}`);
  if(r.ok) viewSettings();
}
async function testOnec(){
  const box=$('onec_test_result'); if(box) box.textContent='Проверка связи…';
  const r=await j('/admin/onec-test',{method:'POST'});

    ? `<span style="color:var(--ok)">✓ Связь есть${r.total!=null?` · товаров в базе: ${num(r.total)}`:''}</span>`
    : `<span style="color:var(--alert)">✗ ${esc(r.reason||'ошибка')}</span>`;
}

async function saveMail(){
  const g=k=>($('mail_'+k)||{}).value;
  const patch={smtp_host:g('smtp_host'), smtp_port:+g('smtp_port')||587, smtp_user:g('smtp_user'),
    smtp_starttls:$('mail_smtp_starttls').checked, mail_from:g('mail_from'),
    mail_from_name:g('mail_from_name'), rate_per_min:+g('rate_per_min')||120};
  const pw=g('smtp_password'); if(pw) patch.smtp_password=pw;
  const r=await j('/admin/mail/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
  toast(r.ok?'Настройки провайдера сохранены':`Ошибка: ${r.reason||''}`);
  if(r.ok) loadMail();
}
async function testMail(){
  const to=($('mail_test_to')||{}).value||'';
  if(!to){ toast('Укажите email'); return; }
  $('mail_test_result').textContent='Отправка…';
  const r=await j('/admin/mail/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to})});
  $('mail_test_result').innerHTML = r.ok
    ? '<span style="color:var(--ok)">✓ Отправлено ('+esc(r.message_id||'')+')</span>'
    : '<span style="color:var(--alert)">✗ '+esc(r.error||'ошибка')+'</span>';
}

let leadFilter={q:'',status:'',page:0};
const LEAD_LIM=50;
function leadsPage(p){ leadFilter.page=Math.max(0,p); viewLeads(); }
async function viewLeads(){
  setTitle('Все лиды','база подписчиков');
  const qs=new URLSearchParams(); if(leadFilter.q)qs.set('q',leadFilter.q); if(leadFilter.status)qs.set('status',leadFilter.status);
  qs.set('limit',LEAD_LIM); qs.set('offset',leadFilter.page*LEAD_LIM);
  const [a,list]=await Promise.all([j('/admin/audience'),j('/admin/leads?'+qs)]);
  const tile=(l,n,s)=>`<div class="tile"><div class="l">${l}</div><div class="n">${num(n)}</div><div class="s">${s}</div></div>`;
  const opt=(v,l,cur)=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`;
  const rows=list.map(l=>`<tr onclick="location.hash='#/lead/'+encodeURIComponent('${esc(l.user_id)}')" style="cursor:pointer">
    <td><span style="color:var(--accent);font-weight:600">${esc(l.email||l.user_id)}</span></td>
    <td><span class="pill ${l.is_unsubscribed?'unsubscribed':'sent'}">${l.is_unsubscribed?'отписан':'подписан'}</span></td>
    <td>${l.source==='wheel'?`<span class="pill live">🎡 Колесо</span>${l.wheel_prize?` <span class="mono" style="color:var(--muted)">${esc(l.wheel_prize)}</span>`:''}`:'<span class="mono" style="color:var(--muted)">—</span>'}</td>
    <td class="mono">${esc(l.category||'—')}</td>
    <td class="mono">${l.last_purchase_at?esc(new Date(l.last_purchase_at).toLocaleDateString('ru-RU')):'—'}</td>
    <td class="mono">${l.consent_at?esc(new Date(l.consent_at).toLocaleDateString('ru-RU')):'—'}</td></tr>`).join('');
  $('view').innerHTML=`<section><div class="grid tiles">
    ${tile('Всего',a.total,'лидов в базе')}
    ${tile('С email',a.with_email,'можно достать письмом')}
    ${tile('Отписаны',a.unsubscribed,'исключены из рассылок')}
    ${tile('Согласие 152-ФЗ',a.consented,'consent зафиксирован')}
    ${tile('С покупками',a.with_purchase,'есть история заказов')}
  </div></section>
  <section><div class="eyebrow"><h2>Список лидов</h2><span class="rule"></span></div>
    <div class="filters">
      <input class="inp wide" type="search" placeholder="поиск по email или id" value="${esc(leadFilter.q)}"
        oninput="leadFilter.q=this.value;leadFilter.page=0; clearTimeout(window._lt); window._lt=setTimeout(viewLeads,300)">
      <select class="inp" onchange="leadFilter.page=0;leadFilter.status=this.value;viewLeads()">
        ${opt('','Все',leadFilter.status)}${opt('subscribed','Подписаны',leadFilter.status)}${opt('unsubscribed','Отписаны',leadFilter.status)}${opt('wheel','🎡 Колесо фортуны',leadFilter.status)}</select>
    </div>
    ${list.length?`<div class="tablewrap"><table><thead><tr>
      <th>Лид</th><th>Статус</th><th>Источник</th><th>Категория покупки</th><th>Последняя покупка</th><th>Согласие</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`+pager(leadFilter.page,list.length>=LEAD_LIM,'leadsPage'):'<div class="tablewrap"><div class="empty">'+(leadFilter.q||leadFilter.status||leadFilter.page?'Лиды не найдены.':'База лидов пуста.')+'</div></div>'+(leadFilter.page?pager(leadFilter.page,false,'leadsPage'):'')}
  </section>`;
}

async function viewLead(uid){
  setTitle('Карточка лида', uid);
  let d;
  try{ d=await j('/admin/lead/'+encodeURIComponent(uid)); }catch(e){ $('view').innerHTML='<section><div class="card empty">Ошибка загрузки.</div></section>'; return; }
  if(!d.found){ $('view').innerHTML='<section><div class="card empty">Лид не найден.</div></section>'; return; }
  const p=d.profile;
  const dt2=iso=>iso?new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
  const f=(k,v)=>`<div class="field"><span class="k">${k}</span><span class="mono">${esc(v)}</span></div>`;
  const emails=d.emails.map(e=>`<tr>
    <td>${esc(SVC[e.service]?.ru||e.service)}</td>
    <td><span class="pill ${esc(e.status)}">${esc(e.status)}</span></td>
    <td class="mono">${esc((e.product_ids||[]).join(', ')||'—')}</td>
    <td class="mono">${dt2(e.sent_at)}</td>
    <td class="mono">${e.order_id?esc(e.order_id):'—'}</td>
    <td class="mono">${e.revenue?rub(e.revenue):'—'}</td></tr>`).join('');
  const orders=d.orders.map(o=>`<tr>
    <td class="mono">${esc(o.order_id)}</td>
    <td><span class="pill ${['cancelled','returned','refunded'].includes((o.status||'').toLowerCase())?'unsubscribed':'sent'}">${esc(o.status)}</span></td>
    <td class="mono">${dt2(o.order_date)}</td>
    <td class="mono">${rub(o.total)}</td></tr>`).join('');
  $('view').innerHTML=`<section>
    <div class="filters"><a class="btn" href="#/leads">← к списку</a></div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div><div class="eyebrow"><h2>Профиль</h2><span class="rule"></span></div><div class="card">
        ${f('Email', p.email||'—')}
        ${f('Статус', p.is_unsubscribed?'отписан':'подписан')}
        ${f('Согласие 152-ФЗ', dt2(p.consent_at))}
        ${p.source==='wheel'?f('Участие в колесе', dt2(p.wheel_spun_at))+f('Приз (промокод)', p.wheel_prize||'—'):''}
        ${f('Категория покупки', p.category||'—')}
        ${f('Указатель ротации', p.rotation||'—')}
      </div></div>
      <div><div class="eyebrow"><h2>Таймеры отправок</h2><span class="rule"></span></div><div class="card">
        ${f('Последняя покупка', dt2(p.last_purchase_at))}
        ${f('Best Offer', dt2(p.last_sent_best_offer))}
        ${f('Брошенная корзина', dt2(p.last_sent_cart))}
        ${f('Постпродажа', dt2(p.last_sent_postsale))}
      </div></div>
    </div></section>
    <section><div class="eyebrow"><h2>История писем (${d.emails.length})</h2><span class="rule"></span></div>
      ${d.emails.length?`<div class="tablewrap"><table><thead><tr><th>Сценарий</th><th>Статус</th><th>Товары</th><th>Отправлено</th><th>Заказ</th><th>Доход</th></tr></thead><tbody>${emails}</tbody></table></div>`:'<div class="tablewrap"><div class="empty">Писем не было.</div></div>'}</section>
    <section><div class="eyebrow"><h2>Заказы (${d.orders.length})</h2><span class="rule"></span></div>
      ${d.orders.length?`<div class="tablewrap"><table><thead><tr><th>Заказ</th><th>Статус</th><th>Дата</th><th>Сумма</th></tr></thead><tbody>${orders}</tbody></table></div>`:'<div class="tablewrap"><div class="empty">Заказов нет.</div></div>'}</section>`;
}

/* Actions */
async function toggle(s,en){
  await j('/admin/config/'+encodeURIComponent(s),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:en})});
  toast(`${SVC[s]?.ru||s}: ${en?'активен':'остановлен'}`); route();
}
async function saveParam(s,k,v,type){
  const val = type==='text' ? v : +v;
  await j('/admin/config/'+encodeURIComponent(s),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({params:{[k]:val}})});
  toast('Сохранено');
}
async function run(s){
  const r=await j('/admin/run/'+encodeURIComponent(s),{method:'POST'});
  toast(r.ok?`${SVC[s]?.ru||s}: обработано ${r.processed}`:`Ошибка: ${r.reason||''}`); route();
}

/* Router */
const ROUTES={overview:viewOverview,leads:viewLeads,services:viewServices,report:viewReport,analytics:viewAnalytics,feeds:viewFeeds,emails:viewEmails,templates:viewTemplates,wheel:viewWheel,settings:viewSettings,integration:viewIntegration};
async function route(){
  const h=(location.hash||'#/overview').slice(2);
  markActive(h.startsWith('lead/')?'leads':h.startsWith('service/')?'services':h.startsWith('templates')?'templates':h);
  try {
    if(h.startsWith('service/')) return await viewService(h.split('/')[1]);
    if(h.startsWith('lead/')) return await viewLead(decodeURIComponent(h.slice(5)));
    if(h==='templates'){ tplView='list'; return await viewTemplates(); }
    if(h.startsWith('templates/')) return await openTemplateView(decodeURIComponent(h.split('/')[1]));
    await (ROUTES[h]||viewOverview)();
  } catch(e){
    if((e&&e.message)==='unauthorized') return;   // j() уже редиректит на /login
    $('view').innerHTML=`<section><div class="tablewrap"><div class="empty">Не удалось загрузить раздел.<br><span class="mono">${esc((e&&e.message)||e)}</span><br>Обновите страницу; если повторяется — проверьте, что запрос проходит через edge (whitelist /admin*).</div></div></section>`;
  }
}
window.addEventListener('hashchange',route);
$('themebtn').onclick=toggleTheme;
$('logoutbtn').onclick=()=>fetch('/logout',{method:'POST'}).finally(()=>location='/login');
function applyNav(){ document.body.classList.toggle('nav-collapsed', localStorage.navCollapsed==='1'); }
$('burger').onclick=()=>{ localStorage.navCollapsed = localStorage.navCollapsed==='1'?'0':'1'; applyNav(); };
applyNav();
applyTheme(localStorage.theme||null);
buildNav();
route();
setInterval(()=>{ const h=(location.hash||'#/overview').slice(2); if(h==='overview'||h==='analytics')route(); }, 20000);
</script>
