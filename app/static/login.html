<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrosterHIT — вход</title>
<style>
:root{
  --bg:#f4f4f7; --canvas:#ffffff; --surface:#ffffff; --glass-border:rgba(22,18,34,.08);
  --border:rgba(22,18,34,.11); --text:#191223; --muted:#6d6479; --blur:18px;
  --brand:#bc39e5; --gold:#fecc00; --alert:#e0464b;
  --grad:linear-gradient(135deg,#d24bf0 0%,#bc39e5 50%,#9c1fbf 100%);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --r:18px; --shadow:0 2px 6px rgba(20,18,28,.06),0 24px 60px rgba(20,18,28,.13);
  --glow:0 6px 22px rgba(168,31,203,.34);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12101a; --canvas:#0b0812; --surface:rgba(28,20,40,.6); --glass-border:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.09); --text:#f0e8f7; --muted:#a89eb8;
  --brand:#c15ae8; --alert:#f0575c;
  --grad:linear-gradient(135deg,#e05cf5 0%,#c15ae8 50%,#a52fc9 100%);
  --shadow:0 2px 8px rgba(0,0,0,.45),0 28px 64px rgba(0,0,0,.6); --glow:0 6px 26px rgba(207,107,239,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);
  color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--r);
  box-shadow:var(--shadow);width:100%;max-width:370px;padding:34px 30px;
  backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4)}
.logo{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:22px}
.mark{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--grad);box-shadow:var(--glow)}
.mark svg{width:22px;height:22px;color:#fff}
.brand-full{display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1}
.brand-mark{width:206px;height:auto;display:block;color:var(--text)}
.brand-sub{font-size:11.5px;color:var(--muted)}
.logo b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.logo span{display:block;font-size:11.5px;color:var(--muted)}
h1{font-size:18px;font-weight:640;margin:26px 0 24px;text-align:center}
.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;transition:border-color .12s,box-shadow .12s}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:12px;background:var(--grad);color:#fff;
  font-size:14px;font-weight:640;font-family:inherit;cursor:pointer;box-shadow:var(--glow);transition:filter .12s,transform .1s,box-shadow .15s}
button:hover{filter:brightness(1.07);transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:default}
.err{margin-top:16px;padding:9px 12px;border-radius:9px;font-size:13px;display:none;
  background:color-mix(in srgb,var(--alert) 14%,transparent);color:var(--alert)}
.err.on{display:block}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">

      <span class="brand-sub">консоль рассылок</span>
    </div>
  </div>
  <label for="u">Логин</label>
  <input id="u" name="username" autocomplete="username" autofocus required>

  <label for="p">Пароль</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>

  <button id="btn" type="submit">Войти</button>
  <div class="err" id="err"></div>
</form>

<script>
const f=document.getElementById('f'), btn=document.getElementById('btn'), err=document.getElementById('err');
f.addEventListener('submit', async e=>{
  e.preventDefault();
  err.classList.remove('on'); btn.disabled=true; btn.textContent='Проверяем…';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:f.username.value, password:f.password.value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.ok){ location='/admin'; return; }
    err.textContent=d.reason||'Не удалось войти'; err.classList.add('on');
  }catch(_){ err.textContent='Сеть недоступна, попробуйте ещё раз'; err.classList.add('on'); }
  btn.disabled=false; btn.textContent='Войти';
});
</script>

</html>
