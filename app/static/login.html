<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrosterHIT — вход</title>
<style>
:root{
  --bg:#f7f3fb; --surface:#ffffff; --border:#e9dff3; --text:#1c1524; --muted:#736a80;
  --brand:#bc39e5; --gold:#fecc00; --alert:#e0464b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --r:13px; --shadow:0 1px 2px rgba(28,21,36,.05),0 10px 30px rgba(120,60,150,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#120b1a; --surface:#1c1426; --border:#352544; --text:#efe7f6; --muted:#9a8ea9;
  --brand:#c15ae8; --alert:#f0575c; --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:
    radial-gradient(1100px 620px at 78% -8%,color-mix(in srgb,var(--brand) 18%,transparent),transparent 60%),
    radial-gradient(900px 520px at 10% 110%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 55%),
    var(--bg);
  color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);width:100%;max-width:360px;padding:32px 28px}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.mark{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),#a81fcb);box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 34%,transparent)}
.mark svg{width:22px;height:22px;color:#fff}
.logo b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.logo span{display:block;font-size:11.5px;color:var(--muted)}
h1{font-size:17px;font-weight:640;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;transition:border-color .12s,box-shadow .12s}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
button{width:100%;margin-top:22px;padding:11px;border:0;border-radius:10px;background:var(--brand);color:#fff;
  font-size:14px;font-weight:640;font-family:inherit;cursor:pointer;transition:filter .12s,opacity .12s}
button:hover{filter:brightness(1.05)}
button:disabled{opacity:.6;cursor:default}
.err{margin-top:16px;padding:9px 12px;border-radius:9px;font-size:13px;display:none;
  background:color-mix(in srgb,var(--alert) 14%,transparent);color:var(--alert)}
.err.on{display:block}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="logo">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 7.5 9 6 9-6"/></svg></div>
    <div><b>GrosterHIT</b><span>консоль рассылок</span></div>
  </div>
  <h1>Вход в консоль</h1>
  <p class="sub">Введите логин и пароль администратора.</p>

  <label for="u">Логин</label>
  <input id="u" name="username" autocomplete="username" autofocus required>

  <label for="p">Пароль</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>

  <button id="btn" type="submit">Войти</button>
  <div class="err" id="err"></div>
</form>

<script>
const f=document.getElementById('f'), btn=document.getElementById('btn'), err=document.getElementById('err');
f.addEventListener('submit', async e=>{
  e.preventDefault();
  err.classList.remove('on'); btn.disabled=true; btn.textContent='Проверяем…';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:f.username.value, password:f.password.value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.ok){ location='/admin'; return; }
    err.textContent=d.reason||'Не удалось войти'; err.classList.add('on');
  }catch(_){ err.textContent='Сеть недоступна, попробуйте ещё раз'; err.classList.add('on'); }
  btn.disabled=false; btn.textContent='Войти';
});
</script>
</body>
</html>
