<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо фортуны — groster.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Только фон страницы-лендинга. Стили самого колеса/попапа инжектит wheel.js. */
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
    color: #fff; font-family: Montserrat, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='46' height='46'><g fill='none' stroke='white' stroke-width='3' stroke-linecap='round' opacity='0.13'><path d='M12 6v12M6 12h12'/></g></svg>") 0 0/46px 46px,
      radial-gradient(120% 120% at 50% -10%, #d05cf5 0%, #bc39e5 44%, #6a12a0 100%);
    background-attachment: fixed;
  }
  .hero { max-width: 520px; }
  h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 900; margin: 0 0 10px; line-height: 1.1; }
  .acc { color: #fecc00; }
  .lead { opacity: .92; font-weight: 500; margin: 0 0 28px; }
  .open {
    background: #35cc00; color: #fff; border: 0; font: 800 17px Montserrat, sans-serif;
    padding: 16px 34px; border-radius: 50px; cursor: pointer;
    box-shadow: 0 10px 24px rgba(35, 160, 0, .4); transition: transform .15s ease, background .15s ease;
  }
  .open:hover { background: #23a000; transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="hero">
    <h1>Колесо фортуны — <span class="acc">скидка до 50%</span></h1>
    <p class="lead">Крутаните колесо и получите персональный промокод на заказ в Гростер.</p>
    <button class="open" id="open">🎡 Крутить колесо</button>
  </div>

  <script src="wheel.js"></script>
  <script>
    // endpoint по умолчанию — same-origin (страницу отдаёт сам API): GET /wheel-config, POST /wheel-lead.
    // open() подтягивает призы/тексты из админки; force — лендинг открываем всегда.
    var open = function () { grosterWheel.open({ force: true }); };
    document.getElementById('open').addEventListener('click', open);
    open(); // прямой заход на /wheel → сразу открыть попап
  </script>
</body>
</html>
