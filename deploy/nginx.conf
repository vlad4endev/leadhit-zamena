# nginx для GrosterHit: TLS-терминация + прокси на API (127.0.0.1:8000).
# Разложить в /etc/nginx/sites-available/grosterhit и слинковать в sites-enabled.

upstream grosterhit_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP → HTTPS.
server {
    listen 80;
    server_name groster.skypath.fun;
    # ACME-челлендж для Let's Encrypt оставляем на HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name groster.skypath.fun;

    ssl_certificate     /etc/letsencrypt/live/groster.skypath.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groster.skypath.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Размер тела: фиды каталога/заказов могут быть крупными.
    client_max_body_size 25m;

    # Вебхук ESP: публичный, но только от IP-диапазонов провайдера (заполнить!).
    location = /esp/webhook {
        # allow 1.2.3.4;   # IP ESP (Unisender/Sendsay/…)
        # deny all;
        proxy_pass http://grosterhit_api;
        include /etc/nginx/grosterhit_proxy.inc;
    }

    # session-ping: публичный (шлётся из браузера), высокочастотный.
    location = /cart-ping {
        proxy_pass http://grosterhit_api;
        include /etc/nginx/grosterhit_proxy.inc;
    }

    # Триггер-сниппет: публичный (грузится тегом <script> с витрины).
    location = /trigger.js {
        proxy_pass http://grosterhit_api;
        include /etc/nginx/grosterhit_proxy.inc;
    }

    # Отписка: публичная (ссылка из футера писем, 152-ФЗ).
    location = /unsubscribe {
        proxy_pass http://grosterhit_api;
        include /etc/nginx/grosterhit_proxy.inc;
    }

    # Служебные эндпоинты (админка, фиды, KPI) — только из внутренней сети / VPN.
    location ~ ^/(admin|feeds|kpi|health) {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        client_max_body_size 50m;   # XML-импорт каталога через /admin/import-xml
        proxy_pass http://grosterhit_api;
        include /etc/nginx/grosterhit_proxy.inc;
    }

    # /demo — dev/reference (пишет в БД): наружу НЕ отдаём, падает в 404 ниже.

    # Остальное закрыто.
    location / { return 404; }
}
