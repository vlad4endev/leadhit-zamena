# nginx для docker-compose: TLS-терминация + прокси на контейнер api:8000.
# Отличие от host-варианта (nginx.conf): upstream по имени сервиса, а admin/feeds/kpi
# наружу НЕ публикуются (под Docker IP-allowlist ненадёжен — клиентский IP маскируется
# docker-шлюзом). Доступ к служебным эндпоинтам — по SSH-туннелю на 127.0.0.1:8000 хоста.

upstream grosterhit_api {
    server api:8000;
    keepalive 16;
}

# HTTP → HTTPS (+ ACME-челлендж для certbot на хосте).
server {
    listen 80;
    server_name groster.skypath.fun;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name groster.skypath.fun;

    ssl_certificate     /etc/letsencrypt/live/groster.skypath.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groster.skypath.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 5m;   # публичные роуты мелкие (пинг/скрипт/отписка)

    # --- Публичные роуты ---
    location = /cart-ping   { proxy_pass http://grosterhit_api; include /etc/nginx/grosterhit_proxy.inc; }
    location = /trigger.js  { proxy_pass http://grosterhit_api; include /etc/nginx/grosterhit_proxy.inc; }
    location = /unsubscribe { proxy_pass http://grosterhit_api; include /etc/nginx/grosterhit_proxy.inc; }

    # Вебхук ESP: публичный. IP-allow под Docker не работает → аутентификация вебхука
    # проверяется в приложении (токен/подпись ESP).
    location = /esp/webhook { proxy_pass http://grosterhit_api; include /etc/nginx/grosterhit_proxy.inc; }

    # admin/feeds/kpi/health/demo/import-xml — НАРУЖУ НЕ ОТДАЁМ.
    # Доступ: ssh -L 8000:127.0.0.1:8000 <server> → http://localhost:8000/admin (см. deploy/DOCKER.md).
    location / { return 404; }
}
