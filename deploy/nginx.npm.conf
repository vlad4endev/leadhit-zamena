# Edge-nginx ЗА Nginx Proxy Manager (NPM терминирует TLS и форвардит сюда по HTTP).
# Задача этого слоя — впустить наружу ТОЛЬКО публичные роуты, всё служебное → 404
# (admin/feeds/kpi/health/demo/import-xml доступны лишь по SSH-туннелю на api).
# Апстрим — контейнер api по имени сервиса в сети grosterhit_default.

upstream grosterhit_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    # NPM уже проставил X-Forwarded-*; пробрасываем дальше в app.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # --- Только публичные роуты ---
    location = /cart-ping   { proxy_pass http://grosterhit_api; }
    location = /trigger.js  { proxy_pass http://grosterhit_api; }
    location = /unsubscribe { proxy_pass http://grosterhit_api; }
    location = /esp/webhook { proxy_pass http://grosterhit_api; }

    # Всё остальное наружу не отдаём.
    location / { return 404; }
}
