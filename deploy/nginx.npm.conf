# Edge-nginx ЗА Nginx Proxy Manager (NPM терминирует TLS и форвардит сюда по HTTP).
# Один хост groster.skypath.fun, два класса путей:
#   1) Публичные роуты (cart-ping/trigger.js/unsubscribe/esp-webhook) — БЕЗ авторизации
#      (нужны сниппету на витрине).
#   2) Всё остальное (admin/feeds/kpi/import-xml/…) — под Basic Auth: у приложения своей
#      авторизации НЕТ, пароль обязан стоять здесь. Файл паролей — deploy/.htpasswd
#      (НЕ в git; создаётся на сервере, монтируется в edge из docker-compose.edge.yml).
# Апстрим — контейнер api по имени сервиса в сети grosterhit_default.

upstream grosterhit_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;   # публичные роуты мелкие

    # NPM уже проставил X-Forwarded-*; пробрасываем дальше в app.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # --- Публичные роуты: без пароля ---
    location = /cart-ping   { proxy_pass http://grosterhit_api; }
    location = /trigger.js  { proxy_pass http://grosterhit_api; }
    location = /unsubscribe { proxy_pass http://grosterhit_api; }
    location = /esp/webhook { proxy_pass http://grosterhit_api; }

    # --- Всё остальное (админка, фиды, kpi, импорт) — под Basic Auth ---
    location / {
        auth_basic           "GrosterHit admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        client_max_body_size 100m;   # /admin/import-xml грузит файл каталога
        proxy_pass http://grosterhit_api;
    }
}
