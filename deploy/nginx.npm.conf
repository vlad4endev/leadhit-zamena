# Edge-nginx ЗА Nginx Proxy Manager (NPM терминирует TLS и форвардит сюда по HTTP).
# Два виртуальных хоста:
#   1) публичный (server_name _): наружу ТОЛЬКО публичные роуты, остальное → 404.
#   2) admin.* : весь app (включая /admin, /feeds, /import-xml). У приложения своей
#      авторизации НЕТ — защита обязана стоять на NPM (Basic Auth / Access List) для
#      этого хоста. Edge доступен только из NPM (внутренний IP), напрямую наружу — нет.
# Апстрим — контейнер api по имени сервиса в сети grosterhit_default.

upstream grosterhit_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    # NPM уже проставил X-Forwarded-*; пробрасываем дальше в app.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # --- Только публичные роуты ---
    location = /cart-ping   { proxy_pass http://grosterhit_api; }
    location = /trigger.js  { proxy_pass http://grosterhit_api; }
    location = /unsubscribe { proxy_pass http://grosterhit_api; }
    location = /esp/webhook { proxy_pass http://grosterhit_api; }

    # Всё остальное наружу не отдаём.
    location / { return 404; }
}

# --- Админ-хост: весь app, ЗАЩИТА (Basic Auth) — на стороне NPM для этого server_name ---
server {
    listen 80;
    server_name admin.groster.skypath.fun;
    client_max_body_size 100m;   # импорт каталога — файл может быть крупным

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location / { proxy_pass http://grosterhit_api; }
}
