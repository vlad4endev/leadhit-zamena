# Edge-nginx ЗА Nginx Proxy Manager (NPM терминирует TLS и форвардит сюда по HTTP).
# Маршрутизация одного хоста groster.skypath.fun (авторизация — в самом app, app/auth.py):
#   - Публичные роуты витрины (сниппет корзины + виджет колеса) — открыты.
#   - /login, /logout, /admin* — проброшены в app; гейт /admin* закрывает сессия app.
#   - Всё остальное (feeds/kpi/health/demo) наружу не отдаём → 404.
# Апстрим — контейнер api по имени сервиса в сети grosterhit_default.
#
# Имя резолвится НА КАЖДЫЙ запрос: nginx кэширует адрес upstream-блока на всё время
# жизни процесса, поэтому после `up -d --build api` (новый контейнер = новый IP) edge
# отдавал 502, пока его не пересоздашь. Резолвер 127.0.0.11 — встроенный DNS docker,
# переменная в proxy_pass отключает кэш адреса. Цена — нет keepalive к апстриму.

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;   # публичные роуты мелкие

    resolver 127.0.0.11 valid=10s ipv6=off;   # встроенный DNS docker
    set $api_upstream "api:8000";

    # NPM уже проставил X-Forwarded-*; пробрасываем дальше в app.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # --- Публичные роуты витрины: корзина-сниппет + виджет «Колесо фортуны» ---
    location = /cart-ping    { proxy_pass http://$api_upstream$request_uri; }
    location = /order        { proxy_pass http://$api_upstream$request_uri; }   # POST: код заказа (без него — 404 nginx)
    location = /track.js     { proxy_pass http://$api_upstream$request_uri; }   # единый тег витрины
    location = /trigger.js   { proxy_pass http://$api_upstream$request_uri; }
    location = /unsubscribe  { proxy_pass http://$api_upstream$request_uri; }
    location = /esp/webhook  { proxy_pass http://$api_upstream$request_uri; }
    location = /wheel.js     { proxy_pass http://$api_upstream$request_uri; }
    location = /wheel-config { proxy_pass http://$api_upstream$request_uri; }
    location = /wheel        { proxy_pass http://$api_upstream$request_uri; }
    location = /wheel-banner { proxy_pass http://$api_upstream$request_uri; }
    location = /wheel-lead   { proxy_pass http://$api_upstream$request_uri; }   # POST: захват лида (без него — 404 nginx)
    location = /wheel-prize  { proxy_pass http://$api_upstream$request_uri; }   # POST: письмо с промокодом

    # --- Вход и админка: авторизацию делает app (форма /login, гейт /admin*) ---
    location = /login  { proxy_pass http://$api_upstream$request_uri; }
    location = /logout { proxy_pass http://$api_upstream$request_uri; }
    location /admin {
        client_max_body_size 100m;   # /admin/import-xml грузит файл каталога
        proxy_pass http://$api_upstream$request_uri;
    }

    # Всё остальное (feeds/kpi/health/demo) наружу не отдаём.
    location / { return 404; }
}
