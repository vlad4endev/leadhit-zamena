# Edge-nginx ЗА Nginx Proxy Manager (NPM терминирует TLS и форвардит сюда по HTTP).
# Маршрутизация одного хоста groster.skypath.fun (авторизация — в самом app, app/auth.py):
#   - Публичные роуты витрины (сниппет корзины + виджет колеса) — открыты.
#   - /login, /logout, /admin* — проброшены в app; гейт /admin* закрывает сессия app.
#   - Всё остальное (feeds/kpi/health/demo) наружу не отдаём → 404.
# Апстрим — контейнер api по имени сервиса в сети grosterhit_default.

upstream grosterhit_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;   # публичные роуты мелкие

    # NPM уже проставил X-Forwarded-*; пробрасываем дальше в app.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # --- Публичные роуты витрины: корзина-сниппет + виджет «Колесо фортуны» ---
    location = /cart-ping    { proxy_pass http://grosterhit_api; }
    location = /order        { proxy_pass http://grosterhit_api; }   # POST: код заказа (без него — 404 nginx)
    location = /track.js     { proxy_pass http://grosterhit_api; }   # единый тег витрины
    location = /trigger.js   { proxy_pass http://grosterhit_api; }
    location = /unsubscribe  { proxy_pass http://grosterhit_api; }
    location = /esp/webhook  { proxy_pass http://grosterhit_api; }
    location = /wheel.js     { proxy_pass http://grosterhit_api; }
    location = /wheel-config { proxy_pass http://grosterhit_api; }
    location = /wheel        { proxy_pass http://grosterhit_api; }
    location = /wheel-banner { proxy_pass http://grosterhit_api; }
    location = /wheel-lead   { proxy_pass http://grosterhit_api; }   # POST: захват лида (без него — 404 nginx)
    location = /wheel-prize  { proxy_pass http://grosterhit_api; }   # POST: письмо с промокодом

    # --- Вход и админка: авторизацию делает app (форма /login, гейт /admin*) ---
    location = /login  { proxy_pass http://grosterhit_api; }
    location = /logout { proxy_pass http://grosterhit_api; }
    location /admin {
        client_max_body_size 100m;   # /admin/import-xml грузит файл каталога
        proxy_pass http://grosterhit_api;
    }

    # Всё остальное (feeds/kpi/health/demo) наружу не отдаём.
    location / { return 404; }
}
