# GrosterHit — прод-стек в Docker. Переменные берутся из .env (см. .env.example, раздел Docker).
# Запуск: docker compose up -d --build   (подробности — deploy/DOCKER.md)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grosterhit
      POSTGRES_USER: grosterhit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Схема применяется автоматически при ПЕРВОМ старте (пустой volume).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grosterhit -d grosterhit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      # В сети compose БД и mailer — по имени сервиса (перебивают .env).
      DATABASE_URL: postgresql://grosterhit:${POSTGRES_PASSWORD}@db:5432/grosterhit
      MAILER_SERVICE_URL: http://mailer:8080
    # Порт только на loopback хоста: наружу — через nginx; admin/feeds — по SSH-туннелю.
    # Хостовый порт настраивается (API_HOST_PORT) — на случай, если 8000 занят (напр. Portainer).
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  workers:
    build: .
    command: python scripts/worker_loop.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://grosterhit:${POSTGRES_PASSWORD}@db:5432/grosterhit
      MAILER_SERVICE_URL: http://mailer:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mailer:
    build: ./mailer-service
    env_file: .env
    environment:
      DB_PATH: /data/outbox.db
      # Токен API mailer'а = токен, которым app к нему стучится (один секрет в .env).
      API_TOKEN: ${MAILER_SERVICE_TOKEN:-}
      # Колбэк статусов доставки обратно в app.
      CALLBACK_URL: http://api:8000/esp/webhook
    volumes:
      - mailer_data:/data
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/grosterhit_proxy.inc:/etc/nginx/grosterhit_proxy.inc:ro
      # TLS-серты и ACME-webroot — с хоста (certbot живёт на хосте).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  mailer_data:
